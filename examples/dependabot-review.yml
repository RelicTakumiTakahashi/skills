name: Dependabot review
on:
  schedule:
    - cron: "0 3 * * 1-5"
  workflow_dispatch:
    inputs:
      pr_number:
        description: 調べ直す PR 番号（空なら開いている Dependabot PR）
        type: string

jobs:
  review:
    uses: RelicTakumiTakahashi/skills/.github/workflows/dependabot-review.yml@main
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      checks: read
      statuses: read
      id-token: write
    with:
      pr_number: ${{ inputs.pr_number || '' }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
